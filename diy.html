<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Looks do Met Gala 2026</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f3f8;
            color: #222;
            padding: 50px 25px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 45px;
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 20px;
            color: #777;
        }

        .looks-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .look {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .look img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            display: block;
            background: #e5e5e5;
        }

        .look-title {
            padding: 18px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
        }

        @media (max-width: 800px) {
            .looks-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 32px;
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 35px 15px;
            }

            .looks-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>Peças do leilão do DIY</h1>
            <p class="subtitle">Usem de referência para a prova.</p>
        </header>

        <div class="looks-grid">

            <!-- 1 -->
            <div class="look">
                <img src="https://i.ibb.co/Ld5bTP82/1787435348171.jpg" alt="Look de Lady Gaga">
                <div class="look-title">Moletom do Diva Depressão</div>
            </div>

            <!-- 2 -->
            <div class="look">
                <img src="https://i.ibb.co/YFBW7WQD/1787435536512.jpg" alt="Look de Rihanna">
                <div class="look-title">Camiseta da Kitty Kawakubo</div>
            </div>

            <!-- 3 -->
            <div class="look">
                <img src="https://i.ibb.co/NnxS8yQV/1787435168363.jpg" alt="Look de Tyla">
                <div class="look-title">Bermuda de Surfista</div>
            </div>

            <!-- 4 -->
            <div class="look">
                <img src="https://i.ibb.co/KpxRC0DX/1787434988997.jpg" alt="Look de Sabrina Carpenter">
                <div class="look-title">Saia Evangê</div>
            </div>

            <!-- 5 -->
            <div class="look">
                <img src="https://i.ibb.co/5h3BMyjS/1787434885602.jpg" alt="Look de Madonna">
                <div class="look-title">Capa de Chuva</div>
            </div>

            <!-- 6 -->
            <div class="look">
                <img src="https://i.ibb.co/0p4Vfn98/1787434916611.jpg" alt="Look de Beyoncé">
                <div class="look-title">Camiseta Xadrez</div>
            </div>

            <!-- 7 -->
            <div class="look">
                <img src="https://i.ibb.co/jkYRPcZr/1787434763132.jpg" alt="Look de Kim Kardashian">
                <div class="look-title">Jaleco</div>
            </div>        </div>

    </div>

</body>
</html>
