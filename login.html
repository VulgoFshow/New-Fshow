<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fshow — Login e Cadastro</title>
    
    <meta name="theme-color" content="#8A2BE2">
    
<style>
/* ===== RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: radial-gradient(circle at 20% 20%, rgba(128,0,255,0.25), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255,140,0,0.25), transparent 40%),
                linear-gradient(135deg, #120018, #1d0033, #2a003d);
    background-size: 200% 200%;
    animation: gradientMove 12s ease infinite;
    background-attachment: fixed;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.main-wrapper {
    width: 100%;
    max-width: 420px;
    animation: fadeIn 0.8s ease-out;
}

.logo-fshow {
    text-align: center;
    font-size: 3rem;
    font-weight: 900;
    margin-bottom: 25px;
    letter-spacing: -2px;
    background: linear-gradient(45deg, #8000ff, #ff8c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 5px 20px rgba(128,0,255,0.4));
    animation: glowLogo 3s ease-in-out infinite alternate;
}

@keyframes glowLogo {
    from { filter: drop-shadow(0 0 10px rgba(128,0,255,0.4)); }
    to { filter: drop-shadow(0 0 25px rgba(255,140,0,0.6)); }
}

.auth-card {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(25px);
    border: 1px solid rgba(128,0,255,0.3);
    border-radius: 26px;
    padding: 35px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(128,0,255,0.15);
    transition: 0.4s ease;
}

.tab-control {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    background: rgba(0,0,0,0.3);
    padding: 6px;
    border-radius: 14px;
}

.tab-btn {
    flex: 1;
    padding: 13px;
    border: none;
    background: transparent;
    color: #aaa;
    font-weight: 600;
    cursor: pointer;
    border-radius: 12px;
    transition: 0.3s;
    font-size: 0.9rem;
}

.tab-btn.active {
    background: linear-gradient(45deg, #8000ff, #ff8c00);
    color: white;
}

form {
    display: none;
    flex-direction: column;
    gap: 18px;
}

form.active {
    display: flex;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.field label {
    font-size: 0.75rem;
    font-weight: 700;
    background: linear-gradient(45deg, #8000ff, #ff8c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(0, 0, 0, 0.3);
    color: white;
    font-size: 1rem;
}

input::placeholder {
    color: rgba(255, 255, 255, 0.5);
}

.btn-submit {
    margin-top: 15px;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(45deg, #8000ff, #ff8c00);
    color: white;
    font-weight: 800;
    cursor: pointer;
    transition: 0.3s ease;
}

.btn-submit:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(255,140,0,0.4);
}

.btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.social-auth {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.btn-social {
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: 0.3s ease;
    font-weight: 600;
    font-size: 0.85rem;
}

.btn-social:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: translateY(-2px);
}

.btn-google {
    background: rgba(255, 255, 255, 0.1);
}

.btn-apple {
    background: rgba(0, 0, 0, 0.45);
    border-color: rgba(255, 255, 255, 0.35);
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: #888;
    font-size: 0.85rem;
}

.divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255, 255, 255, 0.1);
}

.message {
    padding: 12px;
    border-radius: 10px;
    font-size: 0.9rem;
    margin-bottom: 15px;
    display: none;
}

.message.active { display: block; }
.message.error { background: rgba(244, 67, 54, 0.2); color: #f44336; border: 1px solid #f44336; }
.message.success { background: rgba(76, 175, 80, 0.2); color: #4caf50; border: 1px solid #4caf50; }
.message.info { background: rgba(33, 150, 243, 0.2); color: #2196f3; border: 1px solid #2196f3; }

.modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}

.modal.active { display: flex; }

.modal-content {
    background: rgba(20, 20, 20, 0.95);
    border: 1px solid rgba(128,0,255,0.3);
    border-radius: 26px;
    padding: 35px;
    max-width: 420px;
    width: 90%;
    text-align: center;
}

.profile-picture-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.profile-picture {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: #333;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem;
    overflow: hidden;
    border: 2px solid #8000ff;
    position: relative;
}

.profile-picture img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
}

.profile-picture.loading::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

.file-upload {
    font-size: 0.8rem;
    color: #8000ff;
    cursor: pointer;
    text-decoration: underline;
    transition: 0.2s;
}

.file-upload:hover {
    color: #ff8c00;
}

.upload-progress {
    font-size: 0.75rem;
    color: #2196f3;
    display: none;
}

.upload-progress.active {
    display: block;
}

/* Styles for the Logged In Popup */
#alreadyLoggedInModal .user-info {
    margin: 20px 0;
}
#alreadyLoggedInModal .user-name {
    font-size: 1.2rem;
    font-weight: bold;
    margin-top: 10px;
}
#alreadyLoggedInModal .user-email {
    font-size: 0.9rem;
    color: #aaa;
}
#alreadyLoggedInModal .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 25px;
}
#alreadyLoggedInModal .btn-secondary {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    padding: 16px;
    color: white;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s ease;
}
#alreadyLoggedInModal .btn-secondary:hover {
    background: rgba(255,255,255,0.15);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
}
</style>
</head>
<body>

<div class="main-wrapper">
    <h1 class="logo-fshow">FSHOW</h1>

    <div class="auth-card">
        <div class="tab-control">
            <button class="tab-btn active" type="button" data-tab="login">Entrar</button>
            <button class="tab-btn" type="button" data-tab="signup">Criar Conta</button>
        </div>

        <!-- LOGIN -->
        <form id="login-form" class="active">
            <div id="loginMessage" class="message"></div>
            <div class="field">
                <label>E-mail</label>
                <input type="email" id="loginEmail" autocomplete="email" placeholder="exemplo@gmail.com" required>
            </div>
            <div class="field">
                <label>Senha</label>
                <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Sua senha" required>
            </div>
            <div style="text-align: right;">
                <a href="#" id="forgotPasswordLink" style="color: #ff8c00; font-size: 0.8rem; text-decoration: none;">Esqueceu a senha?</a>
            </div>
            <button type="button" class="btn-submit" id="loginBtn">FAZER LOGIN</button>
            
            <div class="divider">ou entre com</div>
            
            <div class="social-auth">
                <button type="button" class="btn-social btn-google" id="googleLoginBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M3.99 12.69c-.18-.66-.27-1.35-.27-2.09 0-.74.09-1.45.26-2.09V5.07H2.18C.635 7.72 0 10.24 0 12.6c0 2.36.635 4.88 2.18 7.53l3.57-2.77c.9-1.05 1.4-2.4 1.4-3.84 0-.74-.09-1.45-.26-2.09v-2.84z" fill="#FBBC05"/>
                        <path d="M12 4.75c1.77 0 3.29.61 4.53 1.6 l3.36-3.36C17.45 1.09 14.97 0 12 0 7.7 0 3.99 2.47 2.18 6.07l3.57 2.77c.9-1.05 2.4-2.09 4.25-2.09z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
                <button type="button" class="btn-social btn-apple" id="appleLoginBtn" aria-label="Entrar com Apple">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.1.8 1.21-.25 2.37-.94 3.66-.84 1.56.13 2.74.74 3.51 1.83-3.22 1.93-2.46 6.18.5 7.37-.59 1.55-1.36 3.09-2.77 3.82zM12.03 7.25C11.88 4.95 13.75 3.05 16 2.87c.31 2.66-2.4 4.65-3.97 4.38z"/>
                    </svg>
                    Apple
                </button>
            </div>
        </form>

        <!-- SIGNUP -->
        <form id="signup-form">
            <div id="signupMessage" class="message"></div>
            <div class="profile-picture-container">
                <div class="profile-picture" id="profilePicturePreview">👤</div>
                <label class="file-upload" for="avatar">Escolher foto</label>
                <input type="file" id="avatar" accept="image/*" style="display: none;">
                <div class="upload-progress" id="uploadProgress"></div>
            </div>
            <div class="field">
                <label>Nome de Usuário</label>
                <input type="text" id="signupNickname" maxlength="30" autocomplete="nickname" placeholder="Seu apelido" required>
            </div>
            <div class="field">
                <label>E-mail</label>
                <input type="email" id="signupEmail" autocomplete="email" placeholder="exemplo@gmail.com" required>
            </div>
            <div class="field">
                <label>Senha</label>
                <input type="password" id="signupPassword" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label>Confirmar Senha</label>
                <input type="password" id="signupPasswordConfirm" autocomplete="new-password" placeholder="Confirme sua senha" required>
            </div>
            <button type="button" class="btn-submit" id="signupBtn">CRIAR CONTA</button>
        </form>
    </div>
</div>

<!-- MODAL RECUPERAR SENHA -->
<div id="forgotPasswordModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-bottom: 20px; color: #8000ff;">Recuperar Senha</h2>
        <div id="forgotPasswordMessage" class="message"></div>
        <div class="field">
            <label>E-mail</label>
            <input type="email" id="forgotPasswordEmail" placeholder="Seu e-mail registrado">
        </div>
        <button type="button" class="btn-submit" id="sendResetEmailBtn" style="width: 100%;">ENVIAR LINK</button>
        <button type="button" id="closeForgotModal" class="btn-secondary" style="width: 100%; margin-top: 10px;">FECHAR</button>
    </div>
</div>

<!-- MODAL USUÁRIO JÁ LOGADO -->
<div id="alreadyLoggedInModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-bottom: 10px; color: #8000ff;">Você já está logado em:</h2>
        
        <div class="user-info">
            <div class="profile-picture-container">
                <div class="profile-picture" id="loggedInAvatar">👤</div>
            </div>
            <div class="user-name" id="loggedInName">Carregando...</div>
            <div class="user-email" id="loggedInEmail">Carregando...</div>
        </div>

        <div class="modal-actions">
            <button type="button" class="btn-submit" id="stayLoggedInBtn" style="width: 100%; margin-top: 0;">Permanecer logado</button>
            <button type="button" class="btn-secondary" id="logoutAndSwitchBtn" style="width: 100%;">Logar em outra conta</button>
        </div>
    </div>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyAiTujI-MKe7E7Zl6yMl9VBqtQBeb0GWNM",
  authDomain: "login-flopshow.firebaseapp.com",
  projectId: "login-flopshow",
  storageBucket: "login-flopshow.firebasestorage.app",
  messagingSenderId: "844646669048",
  appId: "1:844646669048:web:f985b1e0c2544844f3b90d",
  measurementId: "G-GZ7ZX0Z9JL"
};

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import {
        getAuth,
        onAuthStateChanged,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        signInWithPopup,
        GoogleAuthProvider,
        OAuthProvider,
        updateProfile,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: "select_account" });
    const appleProvider = new OAuthProvider('apple.com');

    const SITE_URL = `${window.location.origin}/`;
    let selectedAvatarFile = null;

    function getRedirectUrl() {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');
        if (redirect) {
            try {
                const target = new URL(redirect, window.location.origin);
                if (target.origin === window.location.origin) return target.href;
            } catch (_) {}
        }
        if (document.referrer && document.referrer !== window.location.href) {
            try {
                const ref = new URL(document.referrer);
                if (ref.origin === window.location.origin && !ref.pathname.endsWith('login.html')) {
                    return ref.href;
                }
            } catch (_) {}
        }
        return `${SITE_URL}index.html`;
    }

    const REDIRECT_URL = getRedirectUrl();

    function showMsg(id, text, type) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = text;
        el.className = `message active ${type}`;
        window.clearTimeout(el._hideTimer);
        el._hideTimer = window.setTimeout(() => el.classList.remove('active'), 6000);
    }

    function firebaseError(error) {
        const messages = {
            'auth/invalid-credential': 'E-mail ou senha incorretos.',
            'auth/invalid-email': 'Informe um e-mail válido.',
            'auth/email-already-in-use': 'Este e-mail já está cadastrado.',
            'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
            'auth/popup-closed-by-user': 'A janela de login foi fechada.',
            'auth/popup-blocked': 'O navegador bloqueou a janela de login. Permita pop-ups e tente novamente.',
            'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente novamente.',
            'auth/network-request-failed': 'Falha de conexão. Verifique sua internet e tente novamente.'
        };
        return messages[error?.code] || 'Não foi possível concluir a operação. Tente novamente.';
    }

    function setBusy(button, busy, label) {
        button.disabled = busy;
        button.innerHTML = busy ? `<span class="spinner"></span>${label}` : button.dataset.label;
    }

    function saveLoginTimestamp() {
        localStorage.setItem('lastLoginTime', Date.now().toString());
    }

    function initials(name, email = '') {
        const text = (name || email || 'U').trim();
        return text.split(/\s+/).slice(0, 2).map(part => part[0]).join('').toUpperCase();
    }

    function renderAvatar(element, user) {
        const photo = user.photoURL;
        if (photo) {
            element.innerHTML = `<img src="${photo}" alt="Foto de ${user.displayName || 'usuário'}">`;
        } else {
            element.textContent = initials(user.displayName, user.email);
        }
    }

    function toggleTabs(tab) {
        document.querySelectorAll('form').forEach(form => form.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(button => button.classList.remove('active'));
        document.getElementById(`${tab}-form`).classList.add('active');
        document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
    }

    function resetButton(button, label) {
        button.disabled = false;
        button.dataset.label = label;
        button.textContent = label;
    }

    async function showExistingUser(user) {
        document.getElementById('loggedInName').textContent = user.displayName || 'Usuário';
        document.getElementById('loggedInEmail').textContent = user.email || 'Conta social';
        renderAvatar(document.getElementById('loggedInAvatar'), user);
        document.getElementById('alreadyLoggedInModal').classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.btn-submit').forEach(button => {
            button.dataset.label = button.textContent.trim();
        });

        onAuthStateChanged(auth, user => {
            if (user) showExistingUser(user);
        });

        document.querySelectorAll('.tab-btn').forEach(button => {
            button.addEventListener('click', () => toggleTabs(button.dataset.tab));
        });

        document.getElementById('avatar').addEventListener('change', event => {
            const file = event.target.files?.[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                event.target.value = '';
                return showMsg('signupMessage', 'Selecione uma imagem válida.', 'error');
            }
            if (file.size > 5 * 1024 * 1024) {
                event.target.value = '';
                return showMsg('signupMessage', 'A foto deve ter no máximo 5 MB.', 'error');
            }
            selectedAvatarFile = file;
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('profilePicturePreview').innerHTML = `<img src="${e.target.result}" alt="Prévia da foto">`;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('stayLoggedInBtn').addEventListener('click', () => {
            window.location.href = REDIRECT_URL;
        });

        document.getElementById('logoutAndSwitchBtn').addEventListener('click', async () => {
            try {
                await signOut(auth);
                document.getElementById('alreadyLoggedInModal').classList.remove('active');
                showMsg('loginMessage', 'Você saiu da conta.', 'info');
            } catch (error) {
                showMsg('loginMessage', firebaseError(error), 'error');
            }
        });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) return showMsg('loginMessage', 'Preencha e-mail e senha.', 'error');
            const button = document.getElementById('loginBtn');
            setBusy(button, true, 'Entrando...');
            try {
                await signInWithEmailAndPassword(auth, email, password);
                saveLoginTimestamp();
                showMsg('loginMessage', 'Login realizado. Redirecionando...', 'success');
                window.setTimeout(() => { window.location.href = REDIRECT_URL; }, 700);
            } catch (error) {
                showMsg('loginMessage', firebaseError(error), 'error');
                resetButton(button, 'FAZER LOGIN');
            }
        });

        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                saveLoginTimestamp();
                window.location.href = REDIRECT_URL;
            } catch (error) {
                showMsg('loginMessage', firebaseError(error), 'error');
            }
        });

        document.getElementById('appleLoginBtn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, appleProvider);
                saveLoginTimestamp();
                window.location.href = REDIRECT_URL;
            } catch (error) {
                showMsg('loginMessage', firebaseError(error), 'error');
            }
        });

        document.getElementById('signupBtn').addEventListener('click', async () => {
            const nickname = document.getElementById('signupNickname').value.trim();
            const email = document.getElementById('signupEmail').value.trim().toLowerCase();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupPasswordConfirm').value;
            if (!nickname || !email || !password || !confirm) return showMsg('signupMessage', 'Preencha todos os campos.', 'error');
            if (nickname.length < 3 || nickname.length > 30) return showMsg('signupMessage', 'O apelido deve ter entre 3 e 30 caracteres.', 'error');
            if (password.length < 6) return showMsg('signupMessage', 'A senha precisa ter pelo menos 6 caracteres.', 'error');
            if (password !== confirm) return showMsg('signupMessage', 'As senhas não conferem.', 'error');

            const button = document.getElementById('signupBtn');
            setBusy(button, true, 'Criando...');
            try {
                const credential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(credential.user, { displayName: nickname });
                saveLoginTimestamp();
                showMsg('signupMessage', 'Conta criada com sucesso. Redirecionando...', 'success');
                window.setTimeout(() => { window.location.href = REDIRECT_URL; }, 800);
            } catch (error) {
                showMsg('signupMessage', firebaseError(error), 'error');
                resetButton(button, 'CRIAR CONTA');
            }
        });

        document.getElementById('forgotPasswordLink').addEventListener('click', event => {
            event.preventDefault();
            document.getElementById('forgotPasswordModal').classList.add('active');
        });

        document.getElementById('closeForgotModal').addEventListener('click', () => {
            document.getElementById('forgotPasswordModal').classList.remove('active');
        });

        document.getElementById('sendResetEmailBtn').addEventListener('click', async () => {
            const email = document.getElementById('forgotPasswordEmail').value.trim().toLowerCase();
            if (!email) return showMsg('forgotPasswordMessage', 'Informe o e-mail da conta.', 'error');
            const button = document.getElementById('sendResetEmailBtn');
            setBusy(button, true, 'Enviando...');
            try {
                await sendPasswordResetEmail(auth, email);
                showMsg('forgotPasswordMessage', 'Se existir uma conta para esse e-mail, o link foi enviado.', 'success');
            } catch (error) {
                showMsg('forgotPasswordMessage', firebaseError(error), 'error');
            } finally {
                resetButton(button, 'ENVIAR LINK');
            }
        });

        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', event => {
                if (event.target === modal && modal.id === 'forgotPasswordModal') modal.classList.remove('active');
            });
        });
    });
</script>
</body>
</html>
