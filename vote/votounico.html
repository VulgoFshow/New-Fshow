<style>
/* ===== VARIÁVEIS GLOBAIS ===== */
:root {
  --bg: #121212;
  --card-bg: #2b2b2b;
  --selected-bg: #3c3c3c;
  --panel-bg: #2b2b2b;
  --panel-border: rgba(255, 255, 255, 0.06);
  --accent: #00b7b0;
  --text: #fff;
  --muted: #bdbdbd;
  --border-radius: 8px;
  --transition: all 0.3s ease;
  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.6);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 8px 25px rgba(13, 13, 13, 0.3);
  --back: #0d0d0d;
}

/* ===== BASE ===== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: "Inter", Arial, sans-serif;
  color: var(--text);

  background:
    radial-gradient(circle at 10% 20%, rgba(0, 183, 176, 0.32), transparent 55%),
    radial-gradient(circle at 85% 75%, rgba(0, 110, 255, 0.28), transparent 60%),
    radial-gradient(circle at 50% -20%, rgba(200, 0, 255, 0.25), transparent 70%),
    linear-gradient(145deg, #0a0b0d, #101218 45%, #060708);

  background-attachment: fixed;
  background-size: cover;
  animation: fadeIn 0.7s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== LAYOUT ===== */
.container {
  max-width: 400px;
  margin: 0 auto;
  padding: 20px 15px;
  animation: slideUp 0.6s ease;
}

h1 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 20px;
  text-align: left;
  transition: color 0.3s ease;
}

/* ===== OPÇÕES (RADIO CARDS) ===== */
.option {
  display: flex;
  background: var(--card-bg);
  border: 1px solid #fff;
  border-radius: var(--border-radius);
  margin-bottom: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.3s ease;
}

.option:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--accent);
}

.option.selected,
.option:has(input[type="radio"]:checked) {
  background: rgba(0, 183, 176, 0.2) !important;
  border-color: var(--accent) !important;
}

.option.selected .option-content,
.option:has(input[type="radio"]:checked) .option-content {
  background: transparent !important;
}

.option img {
  width: 150px;
  height: auto;
  object-fit: cover;
  flex-shrink: 0;
  transition: transform 0.4s ease;
}

.option-content {
  display: flex;
  align-items: center;
  padding: 0 12px;
  width: 100%;
  font-size: 18px;
  font-weight: 500;
  transition: background 0.3s ease;
}

.option-content input[type="radio"] {
  appearance: none;
  width: 20px;
  height: 20px;
  border: 2px solid var(--muted);
  border-radius: 50%;
  margin-right: 8px;
  cursor: pointer;
  position: relative;
  transition: border-color 0.3s ease, transform 0.2s ease;
}

.option-content input[type="radio"]:hover {
  transform: scale(1.1);
}

.option-content input[type="radio"]:checked {
  border-color: var(--accent);
}

.option-content input[type="radio"]:checked::before {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: var(--accent);
}

  /* ===== SPINNER ===== */
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ===== BOTÃO PRINCIPAL ===== */
  button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: var(--border-radius);
  margin-top: 15px;
  cursor: pointer;
  background: #444;
  color: var(--muted);
  transition: var(--transition);
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(0, 183, 176, 0.3);
}

button.active {
  background: var(--accent);
  color: #fff;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.notice {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  margin-top: 10px;
}

/* ===== POPUP ===== */
.popup {
  display: none;
  position: fixed;
  z-index: 1500;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
  padding: 20px;
  transition: opacity .25s ease;
}

.popup.active {
  display: flex;
  opacity: 1;
}

/* ===== CONTAINER ===== */
.captcha-box {
  background: #1b1b1b;
  width: 360px;
  max-width: 95%;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,.45);
  animation: fadeIn .3s ease;
  color: #eee;
}

/* ===== CABEÇALHO ===== */
.captcha-header {
  background: #0f7b82;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.captcha-header span {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
  flex: 1;
  color: #fff;
}

.captcha-header img {
  width: 62px;
  height: 62px;
  border-radius: 6px;
  object-fit: cover;
  margin-left: 12px;
}

/* ===== GRID ===== */
.captcha-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 10px;
  background: #00000022;
}

.captcha-img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  border-radius: 6px;
  background: #111;
  cursor: pointer;
  border: 2px solid transparent;
  transition: .15s;
}

.captcha-img:hover {
  transform: scale(1.03);
}

.captcha-img.selected {
  border-color: #fff;
  box-shadow: 0 0 6px rgba(255,255,255,0.5);
}

/* ===== FOOTER ===== */
.captcha-footer {
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: flex-end;
}

/* ===== BOTÃO AVANÇAR ===== */
.captcha-btn {
  background: #e6e6e6;
  color: #222;
  padding: 10px 22px;
  border-radius: 6px;
  cursor: pointer;
  border: none;
  font-weight: 600;
  transition: .15s;
}

.captcha-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.captcha-btn:hover:not(:disabled) {
  background: #fff;
}

/* ===== BOTÃO ICONE ===== */
.captcha-icon-btn {
  background: #2b2b2b;
  border: none;
  padding: 8px;
  border-radius: 6px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .15s;
}

.captcha-icon-btn img {
  width: 20px;
  opacity: 0.8;
}

.captcha-icon-btn:hover {
  background: #333;
}

/* ===== IMG ===== */
.captcha-hand img {
  width: 36px;
  opacity: 0.85;
}

/* ===== PAGINAÇÃO ===== */

.captcha-dots {
  display: flex;
  gap: 4px;
  margin-left: auto;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #222;
  transition: background .15s;
}

.dot.white {
  background: #ffffff !important;
}

.dot.green {
  background: #4CAF50 !important;
}

.dot.active {
  background: none !important;
}

/* ===== CONFIRMAÇÃO ===== */
#fotoConfirm {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

#nomeConfirm {
  background: #1F1F1F;
  color: #fff;
  font-size: 20px;
  font-weight: 700;
  text-align: center;
  padding: 14px;
  border-radius: 0 0 10px 10px;
  border: 1px solid #ddd;
  border-top: none;
  margin: 0;
}

.success-msg {
  background: rgba(0, 255, 150, 0.1);
  border: 1px solid rgba(0, 255, 150, 0.4);
  border-radius: 8px;
  padding: 10px 15px;
  text-align: center;
  color: #00ff99;
  font-weight: 600;
  margin-bottom: 18px;
  animation: fadeIn 0.6s ease;
}

.success-msg::before {
  content: "✔ ";
  color: #00ff99;
}

.voltar {
  background: var(--accent);
  color: #fff;
  transition: background 0.3s ease;
}

.voltar:hover {
  background: #00c9b8;
}

#confirmTela {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
  background: transparent;
  min-height: 85vh;
  animation: slideUp 0.6s ease forwards;
}


.confirm-card {

  border-radius: 12px;

  max-width: 450px;

.confirm-card .img-container {

}

    height: auto;

#botaoCaptcha {
  display: flex;
  align-items: center;
  justify-content: flex-start;

  user-select: none;

  color: #ccc;
  font-size: 14px;
  font-weight: 400;
  transition: var(--transition);
}

#botaoCaptcha:hover {
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(0, 183, 176, 0.3);
}

.recaptcha-checkbox {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  background: #111;
  border: 2px solid #444;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

#botaoCaptcha[aria-pressed="true"] .recaptcha-checkbox {
  background: #00aaff;
  border-color: #00aaff;
}

.checkmark {
  width: 18px;
  height: 18px;
  stroke: white;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: none;
}

#botaoCaptcha[aria-pressed="true"] .checkmark {
  display: block;
}

.recaptcha-label {
  user-select: none;
  line-height: 1;
  flex-grow: 1;
}

.recaptcha-icon {
  width: 40px;
  height: 40px;
  border-radius: 4px;
  object-fit: contain;
  filter: brightness(0.7);
  flex-shrink: 0;
}

#botaoCaptcha:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  pointer-events: none;
}

.bot-bait {
  pointer-events: none;
}

.fade-in-element {
  opacity: 0.6; 
}

.espacador { width: 100%; margin: 10px 0; }

</style>

<script>
(function () {
  const KEY = "fshow_device_id_v1";
  let id = localStorage.getItem(KEY);

  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() :
      ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
      ));
    localStorage.setItem(KEY, id);
  }

  window.FSHOW_DEVICE_ID = id;
})();
</script>

<script type="module">

  // =================== CONFIG ===================
  const TABLE_VOTACAO = "testador";
  const DEBUG = false;

    // =================== HORÁRIOS ===================

// Horário de Brasília (-03:00)
const aberturaBR = new Date("2026-01-18T19:00:00-03:00").getTime();
const encerramentoBR = new Date("2026-08-29T19:00:00-03:00").getTime();

  // =================== ANTI-AUTOCLICK LOGIC ===================
  const AntiAutoclick = {
    MIN_INTERVAL_MS: 400, 
    PUNISHMENTS: [10, 30, 40, 60],
    lastClickTime: 0,

    init() {
      if (!localStorage.getItem('ac_punishments')) localStorage.setItem('ac_punishments', '0');
      if (!localStorage.getItem('ac_blocked_until')) localStorage.setItem('ac_blocked_until', '0');
      this.checkStatus();
    },

    isBlocked() {
      const until = parseInt(localStorage.getItem('ac_blocked_until') || '0');
      return Date.now() < until;
    },

    getRemaining() {
      const until = parseInt(localStorage.getItem('ac_blocked_until') || '0');
      return Math.ceil((until - Date.now()) / 1000);
    },

    checkStatus() {
      if (this.isBlocked()) {
        this.disableVotingUI();
        const timer = setInterval(() => {
          const rem = this.getRemaining();
          if (rem <= 0) {
            clearInterval(timer);
            this.enableVotingUI();
          } else {
            this.updateButtonText(`Bloqueado (${rem}s)`);
          }
        }, 1000);
      }
    },

    registerClick() {
      const now = Date.now();
      if (this.isBlocked()) return true;

      if (this.lastClickTime > 0 && (now - this.lastClickTime) < this.MIN_INTERVAL_MS) {
        this.applyPunishment();
        this.lastClickTime = now;
        return true;
      }

      this.lastClickTime = now;
      return false;
    },

    applyPunishment() {
      let count = parseInt(localStorage.getItem('ac_punishments') || '0');
      const seconds = this.PUNISHMENTS[Math.min(count, this.PUNISHMENTS.length - 1)];
      const until = Date.now() + (seconds * 1000);

      localStorage.setItem('ac_blocked_until', until.toString());
      localStorage.setItem('ac_punishments', (count + 1).toString());

      alert(`Inconsistência Detectada\n\nVocê foi bloqueado por ${seconds} segundos.\nPor favor, vote honestamente.`);
      this.checkStatus();
    },

    disableVotingUI() {
      const btn = document.getElementById("botaoVotar");
      if (btn) {
        btn.disabled = true;
        btn.classList.remove("active");
      }
    },

    enableVotingUI() {
      const btn = document.getElementById("botaoVotar");
      if (btn) {
        btn.textContent = "VOTAR";
        updateBotoesEstado(); 
      }
    },

    updateButtonText(txt) {
      const btn = document.getElementById("botaoVotar");
      if (btn) btn.textContent = txt;
    }
  };

  AntiAutoclick.init();

// =================== HORA DO SERVIDOR ===================
async function getServerTime() {
  try {

    const res = await fetch(
      "https://timeapi.io/api/Time/current/zone?timeZone=America/Sao_Paulo",
      {
        cache: "no-store"
      }
    );

    if (!res.ok) {
      throw new Error("Falha ao buscar horário");
    }

    const data = await res.json();

    const serverDate = new Date(
      data.year,
      data.month - 1,
      data.day,
      data.hour,
      data.minute,
      data.seconds
    );

    return serverDate.getTime();

  } catch (e) {

    console.error("Erro ao verificar horário:", e);

    return Date.now();
  }
}

async function getStatusVotacao() {

      "/api/controle-votacao",

        method: "GET",
        cache: "no-store"
      }
    );

    if (!response.ok) {

    }

      throw new Error(data.error || "Erro ao consultar votação");
    }

    return data.modo;
  } catch (error) {

    console.error("Erro ao consultar status:", error);
    return "automatico";
  }
}

  const votoTela = document.getElementById("votoTela");
  const confirmTela = document.getElementById("confirmTela");
  const nomeConfirm = document.getElementById("nomeConfirm");
  const fotoConfirm = document.getElementById("fotoConfirm");
  const botaoCaptcha = document.getElementById("botaoCaptcha");
  const botaoVotar = document.getElementById("botaoVotar");
  const botaoVotarNovamente = document.getElementById("botaoVotarNovamente");
  const popupCaptcha = document.getElementById("popupCaptcha");
  const captchaGrid = document.getElementById("captchaGrid");
  const captchaInstruction = document.getElementById("captcha-instrucao");
  const verifyBtn = document.getElementById("captchaConfirm");
  const refreshBtn = document.getElementById("captchaRefresh");
  const statusEl = document.getElementById("captchaStatus");

  
  let pendingVote = null;

  let captchaAberto = false;
  let captchaClicado = false;
  let captchaToken = null;
  let captchaCurrentImages = [];
  function updateBotoesEstado() {

    if (AntiAutoclick.isBlocked()) {
        AntiAutoclick.disableVotingUI();
        return;
    }

    const restantes = getVotosRestantes();
    
    if (captchaClicado && restantes > 0) {
      botaoVotar.disabled = false;
      botaoVotar.classList.add("active");
    } else {
      botaoVotar.disabled = true;
      botaoVotar.classList.remove("active");
    }

    if (captchaClicado) {
      botaoCaptcha.setAttribute("aria-pressed", "true");
    } else {
      botaoCaptcha.setAttribute("aria-pressed", "false");
    }
  }

  // ===== CONTROLE LOCAL AUXILIAR =====
  function jaVotouLocalmente() {
    return localStorage.getItem("fshow_voto_unico") === "1";
  }

  function marcarVotoLocalmente() {
    localStorage.setItem("fshow_voto_unico", "1");
  }

  function getVotosRestantes() {
    return jaVotouLocalmente() ? 0 : 1;
  }

  function setVotosRestantes(n) {
    if (Number(n) <= 0) marcarVotoLocalmente();
  }

  async function verificarAcessoUnico() {
    try {
      const response = await fetch("/api/votar", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        cache: "no-store",
        body: JSON.stringify({
          action: "verificar-acesso",
          table: TABLE_VOTACAO,
          deviceId: window.FSHOW_DEVICE_ID
        })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        return {
          permitido: false,
          motivo: data.error || "Não foi possível verificar seu acesso."
        };
      }

      if (data.vpn === true) {
        return {
          permitido: false,
          motivo: "VPN_PROXY"
        };
      }

      if (data.jaVotou === true) {
        marcarVotoLocalmente();
        return {
          permitido: false,
          motivo: "JA_VOTOU"
        };
      }

      return { permitido: true };
    } catch (e) {
      console.error("Erro na verificação de acesso:", e);
      return {
        permitido: false,
        motivo: "Não foi possível verificar sua conexão. Tente novamente."
      };
    }
  }



  function abrirCaptcha() {
    pendingVote = null;
    generateCaptcha();
    popupCaptcha.style.display = "flex";
    captchaAberto = true;
  }

  function fecharCaptcha() {
    popupCaptcha.style.display = "none";
    captchaAberto = false;
    updateBotoesEstado();
  }

async function generateCaptcha() {
  try {
    statusEl.textContent = "";
    verifyBtn.disabled = true;
    verifyBtn.textContent = "Avançar";

    captchaGrid.innerHTML = "";

    const response = await fetch("/api/captcha", {
      method: "GET",
      cache: "no-store"
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "Erro ao gerar CAPTCHA");
    }

    captchaToken = data.token;
    captchaCurrentImages = data.images;

    captchaInstruction.textContent = data.instruction;

    data.images.forEach(imgData => {
      const wrapper = document.createElement("div");
      wrapper.className = "captcha-item";

      const img = document.createElement("img");
      img.src = imgData.src;
      img.className = "captcha-img";
      img.dataset.id = imgData.id;

      wrapper.appendChild(img);
      captchaGrid.appendChild(wrapper);

      wrapper.addEventListener("click", () => {
        img.classList.toggle("selected");

        const anySelected =
          !!document.querySelector(".captcha-img.selected");

        verifyBtn.disabled = !anySelected;
        verifyBtn.textContent =
          anySelected ? "Verificar" : "Avançar";
      });
    });

  } catch (error) {
    console.error("Erro ao gerar CAPTCHA:", error);

    statusEl.textContent =
      "Erro ao carregar o CAPTCHA. Tente novamente.";

    statusEl.style.color = "red";
  }
}

  refreshBtn.addEventListener("click", () => {
    generateCaptcha();
  });

  verifyBtn.addEventListener("click", async () => {

  const selecionadas = [];

  document.querySelectorAll(".captcha-img.selected").forEach(img => {
    selecionadas.push(Number(img.dataset.id));
  });

  if (!selecionadas.length) {
    return;
  }

  verifyBtn.disabled = true;
  verifyBtn.textContent = "Verificando...";

  try {

    const response = await fetch("/api/votar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "validar-captcha",
        captchaToken: captchaToken,
        selectedIds: selecionadas
      })
    });

    const resultado = await response.json();

    if (!response.ok || !resultado.success) {

      statusEl.textContent =
        resultado.error || "CAPTCHA incorreto. Tente novamente.";

      statusEl.style.color = "red";

      verifyBtn.disabled = false;
      verifyBtn.textContent = "Verificar";

      setTimeout(() => {
        generateCaptcha();
      }, 1200);

      return;
    }

    // CAPTCHA aprovado
    setVotosRestantes(resultado.votosLiberados);

    captchaClicado = true;

    updateBotoesEstado();

    fecharCaptcha();

    if (pendingVote) {
      const voto = pendingVote;
      pendingVote = null;

      setTimeout(() => submitVote(voto), 300);
    }

  } catch (error) {

    console.error("Erro ao validar CAPTCHA:", error);

    statusEl.textContent =
      "Erro ao verificar o CAPTCHA. Tente novamente.";

    statusEl.style.color = "red";

    verifyBtn.disabled = false;
    verifyBtn.textContent = "Verificar";
  }
});
  
botaoVotar.addEventListener("click", () => {
  const escolhido = document.querySelector('input[name="vote"]:checked');
  
  if (!escolhido) {
    alert("Selecione alguém para votar!");
    return;
  }

  if (AntiAutoclick.registerClick()) return;
  if (!captchaClicado) {
    alert("Clique no botão de CAPTCHA antes de votar!");
    return;
  }

  if (getVotosRestantes() <= 0) {
    alert("Resolva o CAPTCHA para liberar votos!");
    return;
  }

  // BLOQUEIO 
  botaoVotar.disabled = true;
  botaoVotar.innerHTML = '<span class="spinner"></span>Enviando voto...';

  submitVote(escolhido.value);
});

  updateBotoesEstado();
  
botaoCaptcha.addEventListener("click", async () => {
  if (jaVotouLocalmente()) {
    alert("Este dispositivo já registrou um voto nesta votação.");
    return;
  }

  botaoCaptcha.disabled = true;
  const acesso = await verificarAcessoUnico();

  if (!acesso.permitido) {
    botaoCaptcha.disabled = false;

    if (acesso.motivo === "VPN_PROXY") {
      alert("Votação bloqueada. Desative sua VPN ou proxy e tente novamente.");
    } else if (acesso.motivo === "JA_VOTOU") {
      alert("Este dispositivo ou endereço IP já registrou um voto nesta votação.");
      updateBotoesEstado();
    } else {
      alert(acesso.motivo);
    }
    return;
  }

  botaoCaptcha.disabled = false;
  abrirCaptcha();
});

function scrollParaFinal() {
  setTimeout(() => {
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
  }, 100);
}

document.querySelectorAll('input[name="vote"]').forEach(radio => {
  radio.addEventListener("change", () => { scrollParaFinal(); });
});

(async function init() {
  captchaClicado = false;

  if (jaVotouLocalmente()) {
    updateBotoesEstado();
    return;
  }

  const acesso = await verificarAcessoUnico();

  if (!acesso.permitido) {
    if (acesso.motivo === "VPN_PROXY") {
      botaoCaptcha.disabled = true;
      botaoCaptcha.querySelector(".recaptcha-label").textContent = "VPN/Proxy detectado — votação bloqueada";
      botaoVotar.disabled = true;
    } else if (acesso.motivo === "JA_VOTOU") {
      botaoCaptcha.disabled = true;
      botaoCaptcha.querySelector(".recaptcha-label").textContent = "Voto já registrado neste dispositivo/IP";
      botaoVotar.disabled = true;
    } else {
      botaoCaptcha.disabled = false;
    }
  }

  updateBotoesEstado();
})();
