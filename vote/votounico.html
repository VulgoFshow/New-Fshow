<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Fshow - Votação Única</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="icon" href="https://i.ibb.co/0Vv5RSLg/Logo-Fshow2.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/0Vv5RSLg/Logo-Fshow2.png">
  <meta name="theme-color" content="#8a2be2">

  <style>
  :root {
    --bg: #121212;
    --card-bg: #2b2b2b;
    --selected-bg: #3c3c3c;
    --panel-bg: #2b2b2b;
    --panel-border: rgba(255, 255, 255, 0.06);
    --accent: #00b7b0;
    --text: #fff;
    --muted: #bdbdbd;
    --border-radius: 8px;
    --transition: all 0.3s ease;
    --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.6);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.4);
    --back: #0d0d0d;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: "Inter", Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 10% 20%, rgba(0, 183, 176, 0.32), transparent 55%),
      radial-gradient(circle at 85% 75%, rgba(0, 110, 255, 0.28), transparent 60%),
      radial-gradient(circle at 50% -20%, rgba(200, 0, 255, 0.25), transparent 70%),
      linear-gradient(145deg, #0a0b0d, #101218 45%, #060708);
    background-attachment: fixed;
    background-size: cover;
    animation: fadeIn 0.7s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  .container {
    max-width: 400px;
    margin: 0 auto;
    padding: 20px 15px;
    animation: slideUp 0.6s ease;
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
    text-align: left;
  }

  .option {
    display: flex;
    background: var(--card-bg);
    border: 1px solid #fff;
    border-radius: var(--border-radius);
    margin-bottom: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.3s ease;
  }

  .option:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
    border-color: var(--accent);
  }

  .option.selected,
  .option:has(input[type="radio"]:checked) {
    background: rgba(0, 183, 176, 0.2) !important;
    border-color: var(--accent) !important;
  }

  .option img {
    width: 150px;
    height: auto;
    object-fit: cover;
    flex-shrink: 0;
  }

  .option-content {
    display: flex;
    align-items: center;
    padding: 0 12px;
    width: 100%;
    font-size: 18px;
    font-weight: 500;
  }

  .option-content input[type="radio"] {
    appearance: none;
    width: 20px;
    height: 20px;
    border: 2px solid var(--muted);
    border-radius: 50%;
    margin-right: 8px;
    cursor: pointer;
    position: relative;
  }

  .option-content input[type="radio"]:checked {
    border-color: var(--accent);
  }

  .option-content input[type="radio"]:checked::before {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--accent);
  }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: var(--border-radius);
    margin-top: 15px;
    cursor: pointer;
    background: #444;
    color: var(--muted);
    transition: var(--transition);
  }

  button.active {
    background: var(--accent);
    color: #fff;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .notice {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
  }

  .popup {
    display: none;
    position: fixed;
    z-index: 1500;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .popup.active { display: flex; }

  .captcha-box {
    background: #1b1b1b;
    width: 360px;
    max-width: 95%;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,.45);
    color: #eee;
  }

  .captcha-header {
    background: #0f7b82;
    padding: 14px;
    display: flex;
    align-items: center;
  }

  .captcha-header span {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
  }

  .captcha-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 10px;
    background: #00000022;
  }

  .captcha-img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 6px;
    background: #111;
    cursor: pointer;
    border: 2px solid transparent;
  }

  .captcha-img.selected {
    border-color: #fff;
    box-shadow: 0 0 6px rgba(255,255,255,0.5);
  }

  .captcha-footer {
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: flex-end;
  }

  .captcha-btn {
    background: #e6e6e6;
    color: #222;
    padding: 10px 22px;
    border-radius: 6px;
    cursor: pointer;
    border: none;
    font-weight: 600;
  }

  .captcha-btn:disabled { opacity: .5; cursor: not-allowed; }

  .captcha-icon-btn {
    background: #2b2b2b;
    border: none;
    padding: 8px;
    border-radius: 6px;
    width: 40px;
    height: 40px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .captcha-icon-btn img { width: 20px; opacity: 0.8; }

  #confirmTela {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    min-height: 85vh;
    animation: slideUp 0.6s ease forwards;
  }

  .confirm-card {
    background: transparent;
    border: 2px solid var(--panel-border);
    border-radius: 12px;
    padding: 20px;
    max-width: 450px;
    width: 100%;
    margin: 0 auto;
  }

  .confirm-card .img-container {
    width: 100%;
    height: auto;
    border-radius: 8px 8px 0 0;
    overflow: hidden;
    background: rgba(0, 183, 176, 0.2); 
    border: 1px solid rgba(0, 255, 255, 1);
    border-bottom: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #fotoConfirm {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }

  #nomeConfirm {
    background: #1F1F1F;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    padding: 14px;
    border-radius: 0 0 10px 10px;
    border: 1px solid #ddd;
    border-top: none;
    margin: 0;
  }

  .success-msg {
    background: rgba(0, 255, 150, 0.1);
    border: 1px solid rgba(0, 255, 150, 0.4);
    border-radius: 8px;
    padding: 10px 15px;
    text-align: center;
    color: #00ff99;
    font-weight: 600;
    margin-top: 15px;
  }

  #botaoCaptcha {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    background: #222;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 0 15px;
    height: 70px;
    max-width: 320px;
    width: 320px;
    margin: 20px auto 0;
    cursor: pointer;
    color: #ccc;
    font-size: 14px;
  }

  .recaptcha-checkbox {
    width: 30px;
    height: 30px;
    background: #111;
    border: 2px solid #444;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #botaoCaptcha[aria-pressed="true"] .recaptcha-checkbox {
    background: #00aaff;
    border-color: #00aaff;
  }

  .checkmark {
    width: 18px;
    height: 18px;
    stroke: white;
    stroke-width: 3;
    display: none;
  }

  #botaoCaptcha[aria-pressed="true"] .checkmark { display: block; }
  .recaptcha-label { flex-grow: 1; }
  .recaptcha-icon { width: 40px; height: 40px; filter: brightness(0.7); }

  @media (min-width: 1024px) {
    .container { max-width: 1040px; padding: 40px 20px; }
    h1 { font-size: 28px; }
    .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .option { flex-direction: column; }
    .option img { width: 100%; height: 200px; }
    button { max-width: 420px; margin: 32px auto 0; display: block; }
  }
  </style>
</head>
<body>

  <div id="votoTela" class="container">
    <h1>Quem você quer que VENÇA <br> o Corrida das Blogueiras?</h1>
    
    <div class="options">
      <label class="option">
        <img src="https://i.ibb.co/PGqCNWdN/Bjo-o.png" alt="João">
        <div class="option-content">
          <input type="radio" name="vote" value="João"> João
        </div>
      </label>
      
      <label class="option">
        <img src="https://i.ibb.co/TDk6BNZS/Bl-via.png" alt="Lívia">
        <div class="option-content">
          <input type="radio" name="vote" value="Lívia"> Lívia
        </div>
      </label>

      <label class="option">
        <img src="https://i.ibb.co/fzwGwMwZ/Bludmila.png" alt="Ludmila">
        <div class="option-content">
          <input type="radio" name="vote" value="Ludmila"> Ludmila
        </div>
      </label>
    </div>

    <button id="botaoCaptcha" aria-pressed="false" type="button" aria-label="Não sou um robô">
      <span class="recaptcha-checkbox" aria-hidden="true">
        <svg class="checkmark" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 12l6 6 10-10"/></svg>
      </span>
      <span class="recaptcha-label">Não sou um robô</span>
      <img class="recaptcha-icon" src="https://i.ibb.co/gZZrBqq0/Chat-GPT-Image-16-de-mai-de-2026-13-55-49-1.png" alt="FCaptcha"/>
    </button>

    <button id="botaoVotar" disabled>VOTAR</button>
    <div class="notice">Voto Único — Permitido apenas 1 voto por dispositivo/IP.</div>
  </div>

  <div id="popupCaptcha" class="popup">
    <div class="captcha-box">
      <div class="captcha-header">
        <span id="captcha-instrucao">Selecione os itens correspondentes</span>
      </div>
      <div id="captchaGrid" class="captcha-grid"></div>
      <div class="captcha-footer">
        <button id="captchaRefresh" class="captcha-icon-btn" title="Recarregar">
          <img src="https://i.ibb.co/MyvQhHP4/Seta.png" alt="reload">
        </button>
        <button id="captchaConfirm" class="captcha-btn" disabled>Avançar</button>
      </div>
      <div id="captchaStatus" style="color:#fff; font-size:14px; padding:8px; text-align:center;"></div>
    </div>
  </div>

  <div id="confirmTela">
    <div class="confirm-card">
      <div class="img-container"><img id="fotoConfirm" src="" alt="Voto"/></div>
      <p id="nomeConfirm"></p>
      <div class="success-msg">Voto computado com sucesso!</div>
      <div class="notice" style="margin-top:12px;">Seu voto único já foi registrado. Não é possível votar novamente neste dispositivo ou rede.</div>
    </div>
  </div> 

<script>
(function () {
  const KEY = "fshow_device_id_v1";
  let id = localStorage.getItem(KEY);

  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() :
      ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
      ));
    localStorage.setItem(KEY, id);
  }

  window.FSHOW_DEVICE_ID = id;
})();
</script>

<script type="module">
  const TABLE_VOTACAO = "testador";
  
  const votoTela = document.getElementById("votoTela");
  const confirmTela = document.getElementById("confirmTela");
  const nomeConfirm = document.getElementById("nomeConfirm");
  const fotoConfirm = document.getElementById("fotoConfirm");
  const botaoCaptcha = document.getElementById("botaoCaptcha");
  const botaoVotar = document.getElementById("botaoVotar");
  const popupCaptcha = document.getElementById("popupCaptcha");
  const captchaGrid = document.getElementById("captchaGrid");
  const captchaInstruction = document.getElementById("captcha-instrucao");
  const verifyBtn = document.getElementById("captchaConfirm");
  const refreshBtn = document.getElementById("captchaRefresh");
  const statusEl = document.getElementById("captchaStatus");

  let captchaClicado = false;
  let captchaToken = null;

  function jaVotouLocalmente() {
    return localStorage.getItem("fshow_voto_unico") === "1";
  }

  function marcarVotoLocalmente() {
    localStorage.setItem("fshow_voto_unico", "1");
  }

  function exibirTelaConfirmacao(nome, foto) {
    votoTela.style.display = "none";
    confirmTela.style.display = "flex";
    if (nome) nomeConfirm.textContent = nome;
    if (foto) {
      fotoConfirm.src = foto;
      fotoConfirm.style.display = "block";
    } else {
      fotoConfirm.style.display = "none";
    }
  }

  async function verificarAcessoUnico() {
    try {
      const response = await fetch("/api/votar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "verificar-acesso",
          table: TABLE_VOTACAO,
          deviceId: window.FSHOW_DEVICE_ID
        })
      });

      const data = await response.json();

      if (data.vpn === true) {
        return { permitido: false, motivo: "VPN_PROXY" };
      }

      if (data.jaVotou === true) {
        marcarVotoLocalmente();
        return { permitido: false, motivo: "JA_VOTOU" };
      }

      return { permitido: true };
    } catch (e) {
      console.error("Erro na verificação:", e);
      return { permitido: true };
    }
  }

  function updateBotoesEstado() {
    if (jaVotouLocalmente()) {
      exibirTelaConfirmacao();
      return;
    }

    if (captchaClicado) {
      botaoVotar.disabled = false;
      botaoVotar.classList.add("active");
      botaoCaptcha.setAttribute("aria-pressed", "true");
    } else {
      botaoVotar.disabled = true;
      botaoVotar.classList.remove("active");
      botaoCaptcha.setAttribute("aria-pressed", "false");
    }
  }

  async function generateCaptcha() {
    try {
      statusEl.textContent = "";
      verifyBtn.disabled = true;
      verifyBtn.textContent = "Avançar";
      captchaGrid.innerHTML = "";

      const response = await fetch("/api/captcha", { method: "GET", cache: "no-store" });
      const data = await response.json();

      if (!response.ok || !data.success) throw new Error(data.error || "Erro no CAPTCHA");

      captchaToken = data.token;
      captchaInstruction.textContent = data.instruction;

      data.images.forEach(imgData => {
        const wrapper = document.createElement("div");
        const img = document.createElement("img");
        img.src = imgData.src;
        img.className = "captcha-img";
        img.dataset.id = imgData.id;

        wrapper.appendChild(img);
        captchaGrid.appendChild(wrapper);

        wrapper.addEventListener("click", () => {
          img.classList.toggle("selected");
          const anySelected = !!document.querySelector(".captcha-img.selected");
          verifyBtn.disabled = !anySelected;
          verifyBtn.textContent = anySelected ? "Verificar" : "Avançar";
        });
      });
    } catch (error) {
      statusEl.textContent = "Erro ao carregar CAPTCHA.";
      statusEl.style.color = "red";
    }
  }

  botaoCaptcha.addEventListener("click", async () => {
    if (jaVotouLocalmente()) {
      alert("Seu voto já foi registrado neste dispositivo.");
      exibirTelaConfirmacao();
      return;
    }

    botaoCaptcha.disabled = true;
    const acesso = await verificarAcessoUnico();

    if (!acesso.permitido) {
      if (acesso.motivo === "VPN_PROXY") {
        alert("Votação bloqueada. Desative sua VPN/Proxy para votar.");
      } else if (acesso.motivo === "JA_VOTOU") {
        alert("Este dispositivo ou Endereço IP já registrou um voto.");
        exibirTelaConfirmacao();
      }
      botaoCaptcha.disabled = false;
      return;
    }

    botaoCaptcha.disabled = false;
    generateCaptcha();
    popupCaptcha.style.display = "flex";
  });

  refreshBtn.addEventListener("click", generateCaptcha);

  verifyBtn.addEventListener("click", async () => {
    const selecionadas = [];
    document.querySelectorAll(".captcha-img.selected").forEach(img => {
      selecionadas.push(Number(img.dataset.id));
    });

    if (!selecionadas.length) return;

    verifyBtn.disabled = true;
    verifyBtn.textContent = "Verificando...";

    try {
      const response = await fetch("/api/votar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "validar-captcha",
          captchaToken: captchaToken,
          selectedIds: selecionadas
        })
      });

      const resultado = await response.json();

      if (!response.ok || !resultado.success) {
        statusEl.textContent = resultado.error || "CAPTCHA incorreto.";
        statusEl.style.color = "red";
        setTimeout(generateCaptcha, 1200);
        return;
      }

      captchaClicado = true;
      popupCaptcha.style.display = "none";
      updateBotoesEstado();
    } catch (error) {
      statusEl.textContent = "Erro ao validar CAPTCHA.";
      statusEl.style.color = "red";
    }
  });

  botaoVotar.addEventListener("click", async () => {
    const escolhido = document.querySelector('input[name="vote"]:checked');
    if (!escolhido) {
      alert("Selecione um participante!");
      return;
    }

    if (!captchaClicado) {
      alert("Complete a verificação do CAPTCHA!");
      return;
    }

    botaoVotar.disabled = true;
    botaoVotar.innerHTML = '<span class="spinner"></span>Registrando Voto...';

    const cardPai = escolhido.closest('.option');
    const imagemVotada = cardPai.querySelector('img').src;
    const nomeParticipante = escolhido.value;

    try {
      const response = await fetch("/api/votar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "votar",
          table: TABLE_VOTACAO,
          participante: nomeParticipante,
          captchaToken: captchaToken,
          deviceId: window.FSHOW_DEVICE_ID
        })
      });

      const resultado = await response.json();

      if (!response.ok || !resultado.success) {
        if (resultado.vpn) {
          alert("Erro: Votação bloqueada por uso de VPN.");
        } else if (resultado.jaVotou) {
          alert("Você já votou nesta enquete.");
          marcarVotoLocalmente();
          exibirTelaConfirmacao();
        } else {
          alert(resultado.error || "Erro ao registrar voto.");
        }
        botaoVotar.disabled = false;
        botaoVotar.textContent = "VOTAR";
        return;
      }

      marcarVotoLocalmente();
      exibirTelaConfirmacao(nomeParticipante, imagemVotada);
    } catch (e) {
      alert("Erro na conexão ao enviar o voto.");
      botaoVotar.disabled = false;
      botaoVotar.textContent = "VOTAR";
    }
  });

  (async function init() {
    if (jaVotouLocalmente()) {
      exibirTelaConfirmacao();
      return;
    }

    const acesso = await verificarAcessoUnico();
    if (!acesso.permitido) {
      if (acesso.motivo === "VPN_PROXY") {
        botaoCaptcha.disabled = true;
        botaoCaptcha.querySelector(".recaptcha-label").textContent = "VPN/Proxy Detectado";
      } else if (acesso.motivo === "JA_VOTOU") {
        exibirTelaConfirmacao();
      }
    }
  })();
</script>
</body>
</html>
