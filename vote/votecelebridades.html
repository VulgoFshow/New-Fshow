<style>
/* ===== VARIÁVEIS GLOBAIS ===== */
:root {
  --bg: #121212;
  --card-bg: #2b2b2b;
  --selected-bg: #3c3c3c;
  --panel-bg: #2b2b2b;
  --panel-border: rgba(255, 255, 255, 0.06);
  --accent: #00b7b0;
  --text: #fff;
  --muted: #bdbdbd;
  --border-radius: 8px;
  --transition: all 0.3s ease;
  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.6);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 8px 25px rgba(13, 13, 13, 0.3);
  --back: #0d0d0d;
}

/* ===== BASE ===== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: "Inter", Arial, sans-serif;
  color: var(--text);

  background:
    radial-gradient(circle at 10% 20%, rgba(0, 183, 176, 0.32), transparent 55%),
    radial-gradient(circle at 85% 75%, rgba(0, 110, 255, 0.28), transparent 60%),
    radial-gradient(circle at 50% -20%, rgba(200, 0, 255, 0.25), transparent 70%),
    linear-gradient(145deg, #0a0b0d, #101218 45%, #060708);

  background-attachment: fixed;
  background-size: cover;
  animation: fadeIn 0.7s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== LAYOUT ===== */
.container {
  max-width: 400px;
  margin: 0 auto;
  padding: 20px 15px;
  animation: slideUp 0.6s ease;
}

h1 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 20px;
  text-align: left;
  transition: color 0.3s ease;
}

/* ===== OPÇÕES (RADIO CARDS) ===== */
.option {
  display: flex;
  background: var(--card-bg);
  border: 1px solid #fff;
  border-radius: var(--border-radius);
  margin-bottom: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.3s ease;
}

.option:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--accent);
}

.option.selected,
.option:has(input[type="radio"]:checked) {
  background: rgba(0, 183, 176, 0.2) !important;
  border-color: var(--accent) !important;
}

.option.selected .option-content,
.option:has(input[type="radio"]:checked) .option-content {
  background: transparent !important;
}

.option img {
  width: 150px;
  height: auto;
  object-fit: cover;
  flex-shrink: 0;
  transition: transform 0.4s ease;
}

.option-content {
  display: flex;
  align-items: center;
  padding: 0 12px;
  width: 100%;
  font-size: 18px;
  font-weight: 500;
  transition: background 0.3s ease;
}

.option-content input[type="radio"] {
  appearance: none;
  width: 20px;
  height: 20px;
  border: 2px solid var(--muted);
  border-radius: 50%;
  margin-right: 8px;
  cursor: pointer;
  position: relative;
  transition: border-color 0.3s ease, transform 0.2s ease;
}

.option-content input[type="radio"]:hover {
  transform: scale(1.1);
}

.option-content input[type="radio"]:checked {
  border-color: var(--accent);
}

.option-content input[type="radio"]:checked::before {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: var(--accent);
}

  /* ===== SPINNER ===== */
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ===== BOTÃO PRINCIPAL ===== */
  button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: var(--border-radius);
  margin-top: 15px;
  cursor: pointer;
  background: #444;
  color: var(--muted);
  transition: var(--transition);
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(0, 183, 176, 0.3);
}

button.active {
  background: var(--accent);
  color: #fff;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.notice {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  margin-top: 10px;
}

/* ===== POPUP ===== */
.popup {
  display: none;
  position: fixed;
  z-index: 1500;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
  padding: 20px;
  transition: opacity .25s ease;
}

.popup.active {
  display: flex;
  opacity: 1;
}

/* ===== CONTAINER ===== */
.captcha-box {
  background: #1b1b1b;
  width: 360px;
  max-width: 95%;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,.45);
  animation: fadeIn .3s ease;
  color: #eee;
}

/* ===== CABEÇALHO ===== */
.captcha-header {
  background: #0f7b82;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.captcha-header span {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
  flex: 1;
  color: #fff;
}

.captcha-header img {
  width: 62px;
  height: 62px;
  border-radius: 6px;
  object-fit: cover;
  margin-left: 12px;
}

/* ===== GRID ===== */
.captcha-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 10px;
  background: #00000022;
}

.captcha-img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  border-radius: 6px;
  background: #111;
  cursor: pointer;
  border: 2px solid transparent;
  transition: .15s;
}

.captcha-img:hover {
  transform: scale(1.03);
}

.captcha-img.selected {
  border-color: #fff;
  box-shadow: 0 0 6px rgba(255,255,255,0.5);
}

/* ===== FOOTER ===== */
.captcha-footer {
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: flex-end;
}

/* ===== BOTÃO AVANÇAR ===== */
.captcha-btn {
  background: #e6e6e6;
  color: #222;
  padding: 10px 22px;
  border-radius: 6px;
  cursor: pointer;
  border: none;
  font-weight: 600;
  transition: .15s;
}

.captcha-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.captcha-btn:hover:not(:disabled) {
  background: #fff;
}

/* ===== BOTÃO ICONE ===== */
.captcha-icon-btn {
  background: #2b2b2b;
  border: none;
  padding: 8px;
  border-radius: 6px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .15s;
}

.captcha-icon-btn img {
  width: 20px;
  opacity: 0.8;
}

.captcha-icon-btn:hover {
  background: #333;
}

/* ===== IMG ===== */
.captcha-hand img {
  width: 36px;
  opacity: 0.85;
}

/* ===== PAGINAÇÃO ===== */

.captcha-dots {
  display: flex;
  gap: 4px;
  margin-left: auto;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #222;
  transition: background .15s;
}

.dot.white {
  background: #ffffff !important;
}

.dot.green {
  background: #4CAF50 !important;
}

.dot.active {
  background: none !important;
}

/* ===== CONFIRMAÇÃO ===== */
#fotoConfirm {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

#nomeConfirm {
  background: #1F1F1F;
  color: #fff;
  font-size: 20px;
  font-weight: 700;
  text-align: center;
  padding: 14px;
  border-radius: 0 0 10px 10px;
  border: 1px solid #ddd;
  border-top: none;
  margin: 0;
}

.success-msg {
  background: rgba(0, 255, 150, 0.1);
  border: 1px solid rgba(0, 255, 150, 0.4);
  border-radius: 8px;
  padding: 10px 15px;
  text-align: center;
  color: #00ff99;
  font-weight: 600;
  margin-bottom: 18px;
  animation: fadeIn 0.6s ease;
}

.success-msg::before {
  content: "✔ ";
  color: #00ff99;
}

.voltar {
  background: var(--accent);
  color: #fff;
  transition: background 0.3s ease;
}

.voltar:hover {
  background: #00c9b8;
}

#confirmTela {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
  background: transparent;
  min-height: 85vh;
  animation: slideUp 0.6s ease forwards;
}


.confirm-card {
  background: transparent;
  border: 2px solid var(--panel-border);
  border-radius: 12px;
  padding: 20px;
  max-width: 450px;
  width: 100%;
  margin: 0 auto;
  overflow: hidden;
}

.confirm-card .img-container {
  width: 100%;
  height: auto;
  border-radius: 8px 8px 0 0;
  overflow: hidden;
  background: rgba(0, 183, 176, 0.2); 
  border: 1px solid rgba(0, 255, 255, 255);
  border-bottom: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

#fotoConfirm {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}

@media (min-width: 1024px) {
  .confirm-card .img-container {
    height: auto; 
  }
}

#botaoCaptcha {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 12px;
  background: #222;
  border: 1px solid #444;
  border-radius: 6px;
  padding: 0 15px;
  height: 70px;
  max-width: 320px;
  width: 320px;
  margin: 20px auto 0;
  cursor: pointer;
  user-select: none;
  box-shadow: var(--shadow-sm);
  color: #ccc;
  font-size: 14px;
  font-weight: 400;
  transition: var(--transition);
}

#botaoCaptcha:hover {
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(0, 183, 176, 0.3);
}

.recaptcha-checkbox {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  background: #111;
  border: 2px solid #444;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

#botaoCaptcha[aria-pressed="true"] .recaptcha-checkbox {
  background: #00aaff;
  border-color: #00aaff;
}

.checkmark {
  width: 18px;
  height: 18px;
  stroke: white;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: none;
}

#botaoCaptcha[aria-pressed="true"] .checkmark {
  display: block;
}

.recaptcha-label {
  user-select: none;
  line-height: 1;
  flex-grow: 1;
}

.recaptcha-icon {
  width: 40px;
  height: 40px;
  border-radius: 4px;
  object-fit: contain;
  filter: brightness(0.7);
  flex-shrink: 0;
}

#botaoCaptcha:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  pointer-events: none;
}

.bot-bait {
  pointer-events: none;
}

.fade-in-element {
  opacity: 0.6; 
}

.espacador { width: 100%; margin: 10px 0; }
  
/* =========================
   DESKTOP / PC
   ========================= */
@media (min-width: 1024px) {

  .container {
    max-width: 1040px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  h1 {
    font-size: 28px;
    margin-bottom: 32px;
    text-align: left;
  }

  .options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .option {
    flex-direction: column;
    background: #2b2b2b;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
    cursor: pointer;
    transition: transform .25s ease, box-shadow .25s ease;
  }

  .option:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(0,0,0,.55);
  }

  .option img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    object-position: top;
    display: block;
  }

  .option-content {
    background: #1f1f1f;
    padding: 14px 16px;
    font-size: 17px;
    font-weight: 500;
    display: flex;
    align-items: center;
  }

  .option-content input[type="radio"] {
    margin-right: 10px;
  }

  button {
    max-width: 420px;
    margin: 32px auto 0;
    display: block;
    font-size: 16px;
  }

  /* =========================
     CONFIRMAÇÃO (SUCESSO)
     ========================= */

  #confirmTela {
    padding-top: 60px;
    min-height: auto;
  }

  .confirm-card {
    max-width: 620px;
    margin: 0 auto;
    padding: 28px;
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 15px 40px rgba(0,0,0,.6);
  }

  .confirm-card .img-container {
    height: 280px;
  }

  #nomeConfirm {
    font-size: 24px;
    padding: 16px;
  }

  .success-msg {
    font-size: 15px;
    padding: 14px 20px;
  }

  .voltar {
    max-width: 420px;
    margin: 20px auto 0;
    display: block;
  }
}
</style>

  const AntiAutoclick = {

        this.lastClickTime = now;

async function getServerTime() {
  try {

    const res = await fetch(
      "https://timeapi.io/api/Time/current/zone?timeZone=America/Sao_Paulo",
      {
        cache: "no-store"
      }
    );

    if (!res.ok) {
      throw new Error("Falha ao buscar horário");
    }

    const data = await res.json();

    const serverDate = new Date(
      data.year,
      data.month - 1,
      data.day,
      data.hour,
      data.minute,
      data.seconds
    );

    return serverDate.getTime();

  } catch (e) {

    console.error("Erro ao verificar horário:", e);

    // fallback pro horário local
    return Date.now();
  }
}

    });
  }

  refreshBtn.addEventListener("click", () => {
    generateCaptcha();
  });

  verifyBtn.addEventListener("click", () => {
    const corretoHash = hashTag(captchaCurrentPrompt.correctTag);
    let sucesso = true;
    document.querySelectorAll(".captcha-img").forEach(img => {
      const isCorrect = img.dataset.hash == corretoHash;
      const isSelected = img.classList.contains("selected");
      if (isCorrect !== isSelected) sucesso = false;
    });
    if (!sucesso) {
      statusEl.textContent = "Incorreto. Tente novamente.";
      statusEl.style.color = "red";
      setTimeout(generateCaptcha, 1200);
      return;
    }
    
setVotosRestantes(VOTOS_POR_CAPTCHA);
captchaClicado = true; 
updateBotoesEstado();

fecharCaptcha();

    if (pendingVote) {
      const voto = pendingVote;
      pendingVote = null;
      setTimeout(() => submitVote(voto), 300);
    }
  })
  
  

botaoVotar.addEventListener("click", () => {
  // VERIFICAÇÃO ANTI-AUTOCLICK
  if (AntiAutoclick.registerClick()) return;

  const escolhido = document.querySelector('input[name="vote"]:checked');
  
  if (!escolhido) {
    alert("Selecione alguém para votar!");
    return;
  }

  if (!captchaClicado) {
    alert("Clique no botão de CAPTCHA antes de votar!");
    return;
  }

  if (getVotosRestantes() <= 0) {
    alert("Resolva o CAPTCHA para liberar votos!");
    return;
  }

  // BLOQUEIO IMEDIATO AQUI
  botaoVotar.disabled = true;
  botaoVotar.innerHTML = '<span class="spinner"></span>Enviando voto...';

  submitVote(escolhido.value);
});

async function submitVote(participante) {
  try {
    const agoraBR = await getServerTime();
    if (agoraBR > encerramentoBR) {
      alert("A votação foi encerrada!");
      // Reativa se falhar por horário
      botaoVotar.disabled = false;
      botaoVotar.textContent = "VOTAR";
      return;
    }

    const inputEscolhido = document.querySelector('input[name="vote"]:checked');
    if (!inputEscolhido) {
       botaoVotar.disabled = false;
       botaoVotar.textContent = "VOTAR";
       return;
    }

    const cardPai = inputEscolhido.closest('.option');
    const imagemVotada = cardPai.querySelector('img').src;

    // Já está desativado pelo clique, mas garantimos aqui e salvamos o texto anterior
    const prevText = "VOTAR";
    
    const votos = [];

for (let i = 0; i < pesoVoto; i++) {
votos.push({
  participante: participante
});
}

const { error } = await supabase
  .from(TABLE_VOTACAO)
  .insert(votos);
    
    if (error) {
      console.error("Erro Supabase:", error);
      let msgErro = error.message || JSON.stringify(error);
      alert("ERRO NO SUPABASE:\n" + msgErro + "\n\n1. Verifique se a tabela 'cdf1' existe no seu banco.\n2. Verifique se o RLS permite inserção pública.");
      botaoVotar.disabled = false;
      botaoVotar.textContent = prevText;
      return;
    }
    
setVotosRestantes(Math.max(getVotosRestantes() - 1, 0));
captchaClicado = false;
updateBotoesEstado();

    votoTela.style.display = "none";
    confirmTela.style.display = "flex";
    nomeConfirm.textContent = participante;
    
    // Usamos a imagem capturada do card no momento do voto
    fotoConfirm.src = imagemVotada;
    fotoConfirm.style.display = "block";
    
    botaoVotar.textContent = prevText;
    botaoVotar.disabled = false;
  } catch (e) {
    alert("Erro inesperado: " + e.message);
    botaoVotar.disabled = false;
    botaoVotar.textContent = "VOTAR";
  }
}

function voltarParaVotacao() {
  confirmTela.style.display = "none";
  votoTela.style.display = "block";

  const checked = document.querySelector('input[name="vote"]:checked');
  if (checked) checked.checked = false;

  captchaClicado = false; 
  updateBotoesEstado();
}

  botaoVotarNovamente.addEventListener("click", () => {
    voltarParaVotacao();
  })
  
  updateBotoesEstado();
  
botaoCaptcha.addEventListener("click", () => {
  const restantes = getVotosRestantes();
  if (restantes <= 0) {
    abrirCaptcha(); 
  } else {
    captchaClicado = true;
    updateBotoesEstado();
  }
});

function scrollParaFinal() {
  setTimeout(() => {
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
  }, 100);
}

document.querySelectorAll('input[name="vote"]').forEach(radio => {
  radio.addEventListener("change", () => { scrollParaFinal(); });
});

(function init() {
  captchaClicado = false;
  updateBotoesEstado();
})();
    </script>
