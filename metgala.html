<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Looks do Met Gala 2026</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f3f8;
            color: #222;
            padding: 50px 25px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 45px;
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 20px;
            color: #777;
        }

        .looks-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .look {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .look img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            display: block;
            background: #e5e5e5;
        }

        .look-title {
            padding: 18px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
        }

        @media (max-width: 800px) {
            .looks-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 32px;
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 35px 15px;
            }

            .looks-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>Looks Met Gala 2026</h1>
            <p class="subtitle">Usem de referência para a Night of Cola Quente</p>
        </header>

        <div class="looks-grid">

            <!-- 1 -->
            <div class="look">
                <img src="https://claudia.abril.com.br/wp-content/uploads/2020/01/gettyimages-1147404393.jpg?quality=70&strip=info&w=734" alt="Look de Lady Gaga">
                <div class="look-title">Lady Gaga</div>
            </div>

            <!-- 2 -->
            <div class="look">
                <img src="https://images.elle.com.br/2026/05/Rihanna-1-1240x1680.jpg" alt="Look de Rihanna">
                <div class="look-title">Rihanna</div>
            </div>

            <!-- 3 -->
            <div class="look">
                <img src="https://images.elle.com.br/2026/05/Tyla.jpg" alt="Look de Tyla">
                <div class="look-title">Tyla</div>
            </div>

            <!-- 4 -->
            <div class="look">
                <img src="https://images.elle.com.br/2026/05/Sabrina-Carpenter.jpg" alt="Look de Sabrina Carpenter">
                <div class="look-title">Sabrina Carpenter</div>
            </div>

            <!-- 5 -->
            <div class="look">
                <img src="https://images.elle.com.br/2026/05/looks-do-met-gala-Madonna.jpg" alt="Look de Madonna">
                <div class="look-title">Madonna</div>
            </div>

            <!-- 6 -->
            <div class="look">
                <img src="https://images.elle.com.br/2026/05/looks-do-met-gala-Beyonce.jpg" alt="Look de Beyoncé">
                <div class="look-title">Beyoncé</div>
            </div>

            <!-- 7 -->
            <div class="look">
                <img src="https://images.elle.com.br/2026/05/Kim-Kardashian.jpg" alt="Look de Kim Kardashian">
                <div class="look-title">Kim Kardashian</div>
            </div>

            <!-- 8 -->
            <div class="look">
                <img src="https://images.elle.com.br/2026/05/looks-do-met-gala-Rose.jpg" alt="Look de Rosé">
                <div class="look-title">Rosé</div>
            </div>

            <!-- 9 -->
            <div class="look">
                <img src="https://images.elle.com.br/2026/05/looks-do-met-gala-2026-%E2%80%93-katy-perry.jpg" alt="Look de Katy Perry">
                <div class="look-title">Katy Perry</div>
            </div>

            <!-- 10 -->
            <div class="look">
                <img src="https://images.elle.com.br/2026/05/Doja-Cat.jpg" alt="Look de Doja Cat">
                <div class="look-title">Doja Cat</div>
            </div>

            <!-- 11 -->
            <div class="look">
                <img src="https://images.elle.com.br/2026/05/Cardi-B.jpg" alt="Look de Cardi B">
                <div class="look-title">Cardi B</div>
            </div>

        </div>

    </div>

</body>
</html>
